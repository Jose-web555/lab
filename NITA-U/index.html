
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uganda National IT Skills Assessment 2026</title>

    <!-- Link external CSS -->
    <link rel="stylesheet" href="survey.css">
</head>
<body>

    <!-- Survey Header -->
    <header class="survey-header">
        <img src="images/uganda-coat-of-arms.png"
             alt="Uganda Coat of Arms"
             style="max-width:80px;">

        <h1>National Information Technology Authority — Uganda</h1>
    </header>

    <!-- Survey Banner -->
    <section class="banner">
        <div class="banner-overlay">
            <h2>Uganda National IT Skills Assessment 2026</h2>
        </div>
    </section>

    <!-- Progress Indicator -->
    <section class="progress-section">
        <div class="progress-step current">
            <span>1</span>
            <p>Respondent Details</p>
        </div>

        <div class="progress-line"></div>

        <div class="progress-step">
            <span>2</span>
            <p>Skills Assessment</p>
        </div>

        <div class="progress-line"></div>

        <div class="progress-step">
            <span>3</span>
            <p>Submit</p>
        </div>
    </section>

    <!-- Respondent Details Form -->
    <main class="container">

        <form action="#" method="POST">

            <fieldset>
                <legend>Respondent Details</legend>

                <!-- Title -->
                <div class="form-group">
                    <label for="title">Title</label>
                    <select id="title" name="title" required>
                        <option value="">Select Title</option>
                        <option value="Mr">Mr</option>
                        <option value="Mrs">Mrs</option>
                        <option value="Ms">Ms</option>
                        <option value="Dr">Dr</option>
                    </select>
                </div>

                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname"
                           minlength="4" required>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="+256700000000"
                           pattern="\+256[0-9]{9}"
                           title="Enter a phone number in the format +256 followed by 9 digits">
                </div>

                <!-- Date of Birth -->
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob">
                </div>

                <!-- Gender -->
                <div class="form-group">
                    <label>Gender</label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender"
                                   value="Prefer not to say">
                            Prefer not to say
                        </label>
                    </div>
                </div>

                <!-- Region -->
                <div class="form-group">
                    <label for="region">Region</label>
                    <select id="region" name="region" required>
                        <option value="">Select Region</option>
                        <option value="Central">Central</option>
                        <option value="Eastern">Eastern</option>
                        <option value="Northern">Northern</option>
                        <option value="Western">Western</option>
                    </select>
                </div>

                <!-- Respondent Category -->
                <div class="form-group">
                    <label>Respondent Category</label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="category"
                                   value="ICT Professional">
                            ICT Professional
                        </label>

                        <label>
                            <input type="radio" name="category"
                                   value="Government Officer">
                            Government Officer
                        </label>

                        <label>
                            <input type="radio" name="category"
                                   value="Student">
                            Student
                        </label>
                    </div>
                </div>

                <button type="submit">Continue to Skills Assessment</button>

            </fieldset>
        </form>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 National Information Technology Authority — Uganda</p>
    </footer>

</body>
</html>
